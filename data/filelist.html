<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTTECH | File Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="filelist.css" />
</head>

<body>
  <!-- 1. Dashboard shell and navigation -->
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark"><img src="pic/pic-monitor.png" alt="Inverter"></div>
      <div>
        <h1>ARTTECH</h1>
        <p class="connection"><span class="status-dot"></span>File manager</p>
      </div>
    </div>
    <nav class="top-navigation" aria-label="Primary navigation">
      <a class="top-navigation-link" href="dashboard.html"><span>⚙</span> Dashboard</a>
      <a class="top-navigation-link" href="setting.html"><span>⚒</span> Settings</a>
      <a class="top-navigation-link" href="battery.html"><span>▣</span> Battery</a>
      <a class="top-navigation-link" href="state.html"><span>⇄</span> State</a>
      <a class="top-navigation-link" href="network.html"><span>◉</span> Network</a>
      <a class="top-navigation-link" href="ota.html"><span>⇧</span> OTA Update</a>
      <a class="top-navigation-link active" href="filelist.html"><span>&gt;_</span> Files</a>
    </nav>
    <div class="topbar-actions"></div>
  </header>

  <div class="app-shell">
    <main class="dashboard filelist-page">
      <!-- 2. Page heading -->
      <section class="page-intro">
        <div>
          <p class="overline">LITTLEFS STORAGE</p>
          <h2>File manager</h2>
        </div>
      </section>

      <!-- 3. File list -->
      <section class="panel filelist-panel" aria-labelledby="file-list-title">
        <div class="panel-heading">
          <div>
            <p class="overline">FILESYSTEM</p>
            <h2 id="file-list-title">Stored files</h2>
          </div>
        </div>

        <div class="file-table-container">
          <table class="file-table" id="fileTable">
            <thead>
              <tr>
                <th scope="col">Type</th>
                <th scope="col">Name</th>
                <th scope="col" class="actions-heading">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- Dynamic rows are populated by filelist.js. -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="filelist.js"></script>
</body>

</html>
