<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTTECH | Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css" />
  <link rel="stylesheet" href="info.css" />
</head>
<body>
  <!-- 1. Dashboard shell and navigation -->
  <header class="topbar">
    <div class="brand-block">
      <div class="brand-mark"><img src="pic/pic-monitor.png" alt="Inverter"></div>
      <div>
        <h1>ARTTECH</h1>
        <p class="connection"><span class="status-dot"></span>Device console</p>
      </div>
    </div>
    <nav class="top-navigation" aria-label="Primary navigation">
      <a class="top-navigation-link" href="dashboard.html"><span>⚙</span> Dashboard</a>
      <a class="top-navigation-link" href="setting.html"><span>⚒</span> Settings</a>
      <a class="top-navigation-link" href="battery.html"><span>▣</span> Battery</a>
      <a class="top-navigation-link" href="state.html"><span>⇄</span> State</a>
      <a class="top-navigation-link" href="network.html"><span>◉</span> Network</a>
      <a class="top-navigation-link" href="ota.html"><span>⇧</span> OTA Update</a>
      <a class="top-navigation-link active" href="info.html" aria-current="page"><span>&gt;_</span> Console</a>
    </nav>
    <div class="topbar-actions info-device-status">
      <span>IP</span>
      <strong id="device_ip">--</strong>
    </div>
  </header>

  <div class="app-shell">
    <main class="dashboard info-page">
      <!-- 2. Page heading -->
      <section class="page-intro">
        <div>
          <p class="overline">DEVICE DIAGNOSTICS</p>
          <h2>Console</h2>
        </div>
      </section>

      <!-- 3. Live console -->
      <section class="info-panel" aria-labelledby="console-title">
        <header class="info-header">
          <div>
            <p class="overline">REAL-TIME STREAM</p>
            <h2 id="console-title">Inverter terminal</h2>
          </div>
          <span class="connection-state" id="connectionState" role="status" aria-live="polite">
            <span class="connection-indicator" id="connectionIndicator"></span>
            <span id="connectionLabel">Connecting</span>
          </span>
        </header>

        <div class="info-content">
          <!-- 3.1 Terminal output -->
          <section class="console-card" aria-labelledby="terminal-title">
            <header class="console-header">
              <h3 id="terminal-title">Live output</h3>
              <button class="console-clear" id="clearBtn" type="button">Clear</button>
            </header>
            <div class="terminal" id="terminal" role="log" aria-live="polite" aria-relevant="additions text">
              <p class="terminal-empty" id="terminalEmpty">Waiting for device messages...</p>
            </div>
          </section>

          <!-- 3.2 Command input -->
          <form class="console-command" id="commandForm">
            <label class="visually-hidden" for="messageInput">Inverter command</label>
            <input class="command-input" type="text" id="messageInput" placeholder="Enter inverter command" autocomplete="off" />
            <button class="command-send" id="sendBtn" type="submit">Send</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="info.js"></script>
</body>
</html>
