<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARTTECH</title>
  <link rel="stylesheet" href="substyle.css" />
  <link rel="stylesheet" href="mainstyle.css" />
</head>

<body>
  <!-- Overlay Scanline Effect -->
  <div class="cyber-scanline"></div>

  <!-- Cyber Top Navbar -->
  <header class="navbar">
    <div class="navbar-brand">
      <a href="index.html" class="navbar-logo-link">
        <span class="logo-symbol">⚡</span>
        <span class="navbar-text">ARTTECH <span class="sub-logo">// CONTROL HUB</span></span>
      </a>
    </div>
    <div class="navbar-actions">
      <!-- IP Display ย้ายมาไว้ที่นี่ -->
      <div class="sync-indicator">
        <span class="sync-label">IP:</span>
        <span id="esp32-ip" class="sync-time">--</span>
      </div>

      <div class="sync-indicator">
        <span class="pulse-dot"></span>
        <span class="sync-label">SYSTEM:</span>
        <span class="sync-time">READY</span>
      </div>
    </div>
  </header>

  <!-- App Layout with Sidebar and Main Content -->
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <span class="nav-icon">▤</span>
          <span>HUB</span>
        </a>
        <a href="monitor.html" class="nav-item">
          <span class="nav-icon">⚙</span>
          <span>MONITOR</span>
        </a>
        <a href="setting.html" class="nav-item">
          <span class="nav-icon">🛠</span>
          <span>SETTINGS</span>
        </a>
        <a href="battery.html" class="nav-item">
          <span class="nav-icon">🔋</span>
          <span>BATTERY</span>
        </a>
        <a href="state.html" class="nav-item">
          <span class="nav-icon">⇄</span>
          <span>STATE</span>
        </a>
        <a href="network.html" class="nav-item active">
          <span class="nav-icon">🌐</span>
          <span>NETWORK</span>
        </a>
        <a href="ota.html" class="nav-item">
          <span class="nav-icon">⇪</span>
          <span>OTA UPDATE</span>
        </a>
        <a href="info.html" class="nav-item">
          <span class="nav-icon">&gt;_</span>
          <span>CONSOLE</span>
        </a>
      </nav>
    </aside>

    <!-- Central Dashboard Portal Top-Aligned -->
    <div class="main-container">
      <div class="blockhead">
        <div class="blockname">
          <p class="namehead">NETWORK SETTING</p>
        </div>
      </div>

      <div class="blockcontent">
        <!-- //ToggleSetting////////////////////////////////////////////////////////////////////////////////////// -->

        <div class="toggle-row">
          <span class="toggle">WIFI MODE
            <span id="wifi-mode" class="toggle-batt"></span>
          </span>

          <label class="switch">
            <input id="wifiModeToggle" type="checkbox" onchange="wifiMode(this); toggleSetting(this, 'wifi mode')" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <span class="toggle">IP Config
            <span id="ipConfig" class="toggle-batt"></span>
          </span>

          <label class="switch">
            <input id="ipConfigToggle" type="checkbox" onchange="IPconfig(this)" />
            <span class="slider"></span>
          </label>
        </div>

        <!--.//input field///////////////////////////////////////////////////////////////////////////////////// -->

        <div class="card-main">
          <div class="para-name"><span>WIFI SSID</span></div>
          <form class="setting-input" data-setting="wifi_ssid">
            <div class="form-row">
              <input class="text-input" type="text" id="wifi_ssid" name="wifi_ssid" placeholder="WIFI" required />
            </div>
          </form>

          <div class="para-name"><span>WIFI pass</span></div>
          <form class="setting-input" data-setting="wifi_pass">
            <div class="form-row">
              <input id="wifi_pass" type="password" aria-describedby="toggleHint" placeholder="Password" />
              <button id="wifi_toggle" class="icon-btn" type="button" data-target="wifi_pass" aria-pressed="false"
                aria-label="แสดงรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="1.5" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                </svg>
              </button>
            </div>
          </form>

          <!-- Static IP Settings -->
          <div class="block-ipstatic" id="ip-hide">
            <div class="para-name"><span>IP Address</span></div>
            <form class="setting-input" data-setting="ip_address">
              <div class="form-row">
                <input class="text-input" type="text" id="ip_address" name="ip_address" placeholder="192.168.1.9"
                  required />
              </div>
            </form>

            <div class="para-name"><span>Subnet Mask</span></div>
            <form class="setting-input" data-setting="subnet_mask">
              <div class="form-row">
                <input class="text-input" type="text" id="subnet_mask" name="subnet_mask" placeholder="255.255.255.0"
                  required />
              </div>
            </form>

            <div class="para-name"><span>Gateway</span></div>
            <form class="setting-input" data-setting="default_gateway">
              <div class="form-row">
                <input class="text-input" type="text" id="default_gateway" name="default_gateway" placeholder="192.168.1.1" required />
              </div>
            </form>
          </div>

          <!-- MQTT Settings -->
          <div class="para-name"><span>MQTT User</span></div>
          <form class="setting-input" data-setting="mqtt_server">
            <div class="form-row">
              <input class="text-input" type="text" id="mqtt_user" name="mqtt_user" placeholder="MQTT User" required />
            </div>
          </form>

          <div class="para-name"><span>MQTT pass</span></div>
          <form class="setting-input" data-setting="mqtt_pass">
            <div class="form-row">
              <input id="mqtt_pass" type="password" aria-describedby="toggleHint" placeholder="Password" />
              <button id="mqtt-toggle" class="icon-btn" type="button" data-target="mqtt_pass" aria-pressed="false"
                aria-label="แสดงรหัสผ่าน">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" stroke="currentColor" stroke-width="1.5" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                </svg>
              </button>
            </div>
          </form>

          <div class="para-name"><span>MQTT Server</span></div>
          <form class="setting-input" data-setting="mqtt_server">
            <div class="form-row">
              <input class="text-input" type="text" id="mqtt_server" name="mqtt_server" placeholder="192.168.1.247"
                required />
            </div>
          </form>

          <div class="para-name"><span>MQTT Port</span></div>
          <form class="setting-input" data-setting="mqtt_port">
            <div class="form-row">
              <input class="text-input" type="text" id="mqtt_port" name="mqtt_port" placeholder="1883" required />
            </div>
          </form>
        </div>

        <div class="card-middle">
          <button class="button-save" onclick="sendConfig()">SAVE</button>
        </div>
      </div>
    </div>
  </div>

  <script src="info.js"></script>
  <script src="network.js"></script>
</body>

</html>
